[package]
name = "copilot-example-movies"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
maud = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
